name: "p1 ENV: Snowflake Terraform Demo Workflow"

on: 
  push:
    branches: 
      - p1

jobs:
  deploy-terraform-p1:
    name: "Plan & Deploy Terraform plan on p1"
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      # - name: Configure AWS credentials
      #   uses: aws-actions/configure-aws-credentials@v2
      #   with:
      #     aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
      #     aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      #     aws-region: ap-southeast-2

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}
      - name: Terraform Init
        id: init
        run: terraform -chdir=./p1 init

      - name: Terraform Format
        id: fmt
        run: terraform -chdir=./p1 fmt -recursive -check

      - name: Terraform Validate
        id: validate
        run: terraform -chdir=./p1 validate -no-color

      - name: Terraform Plan
        id: plan
        run: terraform -chdir=./p1 plan 
        env:
          TF_VAR_snowflake_private_key: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}

      - name: Terraform Apply
        id: apply
        run: terraform -chdir=./p1 apply -auto-approve
        env:
          TF_VAR_snowflake_private_key: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}